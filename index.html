<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="StyleSheet" href="CSS/all.css" />
    <link rel="StyleSheet" href="CSS/bootstrap.css" />
    <link rel="StyleSheet" href="currencyconvert.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Carter+One&family=Clarity+City:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main d-flex flex-column">
      <header
        class="d-flex justify-content-around sticky-top align-items-center bg-black"
      >
        <img
          src="https://exchanger-nine.vercel.app/images/nav-banner.png"
          alt="Error in loading photo"
        />
        <h1 class="text-success fs-2">Currency Converter</h1>
      </header>

      <div class="flex-grow-1 d-flex justify-content-center align-items-center">
        <div class="Display_area">
          <h1 class="ms-3 text-success">Amount</h1>
          <textarea
            class="amount text-primary ms-5 align-content-center"
            placeholder="1 By default"
          ></textarea>
          <button class="change bg-transparent border-0">
            <i class="fa-solid fa-arrow-right-arrow-left fs-2 text-primary"></i>
          </button>
          <div
            class="dropdown-row d-flex justify-content-between align-items-center w-75 gap-3"
          >
            <div class="select-container flex-grow-1">
              <div class="d-flex align-items-center gap-2">
                <div id="from-flag"></div>
                <label for="from-currency" class="text-white-50 mb-1 d-block"
                  >From</label
                >
                <select id="from-currency" class="custom-select w-100"></select>
              </div>
            </div>
            <div class="select-container flex-grow-1">
              <div class="d-flex align-items-center gap-2">
                <div id="to-flag"></div>
                <label for="to-currency" class="text-white-50 mb-1 d-block"
                  >To</label
                >
                <select id="to-currency" class="custom-select w-100"></select>
              </div>
            </div>
          </div>
          <div class="displayvalue w-100 text-center mt-4"></div>
        </div>
      </div>
    </div>

    <script src="Java Script/bootstrap.bundle.js"></script>
    <script src="currencyconvert.js"></script>
  </body>
</html>
